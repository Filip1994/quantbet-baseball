name: Baseball data footprint

on:
  push:
    paths:
      - ".github/workflows/baseball-collect.yml"
      - "src/quantbot/baseball/**"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
      timezone: "Europe/Belgrade"

permissions:
  contents: write

concurrency:
  group: baseball-data-footprint
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      API_BASEBALL_KEY: ${{ secrets.API_BASEBALL_KEY }}
      API_BASEBALL_BASE_URL: https://v1.baseball.api-sports.io
      # 74 hard request attempts/run x 96 runs/day = 7,104/day max.
      # Leaves ~396/day headroom under a 7,500/day subscription.
      BASEBALL_API_REQUEST_BUDGET: "74"
      BASEBALL_API_MAX_ATTEMPTS: "3"
      BASEBALL_API_RETRY_BASE_SECONDS: "1"
      TIMEZONE: Europe/Belgrade
      PAPER_MODE: "true"
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - name: Validate API key presence
        run: test -n "$API_BASEBALL_KEY"

      - name: Collect Baseball snapshots and market coverage
        run: |
          python -c "from pathlib import Path; from quantbot.baseball.collector import collect_once; print(collect_once(Path('.'), max_odds_requests=72))"

      - name: Scan Baseball intraday paper signals
        run: |
          python -c "from pathlib import Path; from quantbot.baseball.signals import scan_once, send_alerts; from quantbot.baseball.config import BaseballSettings; root=Path('.'); print(scan_once(root)); print({'alerts_sent': send_alerts(root, BaseballSettings.from_env(root))})"

      - name: Build human-readable API audit
        run: python scripts/baseball_audit.py

      - name: Commit Baseball data footprint
        run: |
          git add data/baseball
          if [ -f baseball_intraday_signals.json ]; then git add baseball_intraday_signals.json; fi
          if git diff --cached --quiet; then
            echo "No new Baseball snapshot data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect Baseball market snapshots"
          git push origin main
