name: Baseball training dataset

on:
  workflow_dispatch:
  push:
    branches:
      - feature/baseball-training-dataset
    paths:
      - "src/quantbot/baseball/**"
      - "scripts/baseball_*.py"
      - "tests/**"
      - ".github/workflows/baseball-training.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      PAPER_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q src scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
