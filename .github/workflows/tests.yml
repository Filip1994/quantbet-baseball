name: Baseball tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q src tests
      - run: ruff format .
      - name: Emit analytics formatter payload
        run: |
          echo "===ANALYTICS_B64==="
          base64 -w0 src/quantbot/baseball/analytics.py
          echo
          echo "===DASHBOARD_B64==="
          base64 -w0 src/quantbot/baseball/dashboard.py
          echo
          echo "===TEST_B64==="
          base64 -w0 tests/test_baseball_analytics.py
          echo
          echo "===END_FORMATTED_FILES==="
      - run: ruff check .
      - run: pytest
