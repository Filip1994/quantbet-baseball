name: Baseball tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Keep CI as the final Ruff + pytest gate for every Baseball change.
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
