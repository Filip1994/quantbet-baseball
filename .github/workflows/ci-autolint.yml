name: One-shot CI autofix

on:
  push:
    branches:
      - chore/green-main-ci
    paths:
      - ".github/workflows/ci-autolint.yml"

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/green-main-ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Apply safe Ruff fixes
        run: ruff check --fix --unsafe-fixes .
      - name: Reformat after lint fixes
        run: ruff format .
      - name: Commit safe lint fixes
        run: |
          if git diff --quiet; then
            echo "Nothing to fix"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply safe Ruff lint fixes"
          git push origin HEAD:chore/green-main-ci
