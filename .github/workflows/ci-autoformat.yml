name: One-shot CI autoformat

on:
  push:
    branches:
      - chore/green-main-ci
    paths:
      - ".github/workflows/ci-autoformat.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/green-main-ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Apply Ruff formatter
        run: ruff format .
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            echo "Nothing to format"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Format repository with Ruff"
          git push origin HEAD:chore/green-main-ci
