jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quantbet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quantbet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q src tests
      - name: Check focused formatting
        run: >
          ruff format --check
          src/quantbot/baseball/api.py
          src/quantbot/baseball/activation_gate.py
          src/quantbot/baseball/canary.py
          src/quantbot/baseball/db.py
          src/quantbot/baseball/decision_lifecycle.py
          src/quantbot/baseball/decision_repository.py
          src/quantbot/baseball/durable_collector.py
          src/quantbot/baseball/ingestion.py
