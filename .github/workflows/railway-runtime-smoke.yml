name: Railway runtime smoke

on:
  push:
    paths:
      - "src/quantbot/baseball/db.py"
      - "src/quantbot/baseball/worker.py"
      - "migrations/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "tests/test_runtime_foundation.py"
      - ".github/workflows/railway-runtime-smoke.yml"
  pull_request:
    paths:
      - "src/quantbot/baseball/db.py"
      - "src/quantbot/baseball/worker.py"
      - "migrations/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "tests/test_runtime_foundation.py"
      - ".github/workflows/railway-runtime-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q src tests
      - run: ruff format --check src/quantbot/baseball/db.py src/quantbot/baseball/worker.py tests/test_runtime_foundation.py
      - name: Show canonical Ruff import fix
        run: |
          ruff check --fix src/quantbot/baseball/db.py src/quantbot/baseball/worker.py tests/test_runtime_foundation.py
          git diff -- src/quantbot/baseball/db.py src/quantbot/baseball/worker.py tests/test_runtime_foundation.py
          git diff --exit-code -- src/quantbot/baseball/db.py src/quantbot/baseball/worker.py tests/test_runtime_foundation.py
      - run: pytest tests/test_runtime_foundation.py tests/test_evidence_store.py
